services:
  postgres:
    image: postgres:18
    container_name: comunicacao-postgres
    environment:
      POSTGRES_DB: api_desafio_comunicacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_desafio_comunicacao"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api-desafio-comunicacao
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/api_desafio_comunicacao
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: